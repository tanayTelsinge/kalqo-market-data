name: Fetch Market Rates

on:
  schedule:
    - cron: '30 4 * * 1-5'   # 10:00 AM IST Mon–Fri
    - cron: '30 10 * * 1-5'  # 4:00 PM IST Mon–Fri
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install yfinance
        run: pip install yfinance --quiet

      - name: Fetch rates
        run: |
          python3 << 'EOF'
          import yfinance as yf
          import json, sys
          from datetime import datetime, timezone

          symbols = ['GC=F', 'SI=F', 'USDINR=X']
          result = []

          for symbol in symbols:
              try:
                  hist = yf.Ticker(symbol).history(period='5d')
                  if hist.empty:
                      print(f'WARNING: No data for {symbol}', file=sys.stderr)
                      continue
                  price      = float(hist['Close'].iloc[-1])
                  prev_close = float(hist['Close'].iloc[-2]) if len(hist) > 1 else price
                  change     = price - prev_close
                  change_pct = (change / prev_close * 100) if prev_close else 0
                  result.append({
                      'symbol': symbol,
                      'regularMarketPrice': round(price, 4),
                      'regularMarketChange': round(change, 4),
                      'regularMarketChangePercent': round(change_pct, 4),
                  })
                  print(f'{symbol}: {price:.4f}  ({change_pct:+.2f}%)')
              except Exception as e:
                  print(f'ERROR {symbol}: {e}', file=sys.stderr)

          if not result:
              print('No quotes fetched — aborting', file=sys.stderr)
              sys.exit(1)

          data = {
              'quoteResponse': {'result': result},
              'fetchedAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }

          with open('data/rates.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f'OK: {len(result)}/{len(symbols)} symbols written to data/rates.json')
          EOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "rates: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
