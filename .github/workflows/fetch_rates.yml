# Drop this file into:  .github/workflows/fetch_rates.yml
# in your kalqo-market-data GitHub repo.
#
# Also create an empty file at:  data/rates.json  (content: {})

name: Fetch Market Rates

on:
  schedule:
    - cron: '30 4 * * 1-5'   # 10:00 AM IST Mon–Fri
    - cron: '30 10 * * 1-5'  # 4:00 PM IST Mon–Fri
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch rates via Python
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import sys
          from datetime import datetime, timezone

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36'

          # Step 1: Get cookie from fc.yahoo.com
          req = urllib.request.Request('https://fc.yahoo.com/', headers={'User-Agent': UA})
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  raw_cookie = resp.headers.get('Set-Cookie', '')
                  cookie = raw_cookie.split(';')[0].strip()
          except Exception as e:
              print(f'Cookie fetch failed: {e}', file=sys.stderr)
              cookie = ''

          print(f'Cookie: {cookie[:40]}...')

          # Step 2: Get crumb
          crumb = ''
          if cookie:
              req2 = urllib.request.Request(
                  'https://query2.finance.yahoo.com/v1/test/getcrumb',
                  headers={'User-Agent': UA, 'Cookie': cookie}
              )
              try:
                  with urllib.request.urlopen(req2, timeout=10) as resp:
                      crumb = resp.read().decode('utf-8').strip()
              except Exception as e:
                  print(f'Crumb fetch failed: {e}', file=sys.stderr)

          print(f'Crumb: {crumb}')

          # Step 3: Fetch quotes
          symbols = 'GC=F,SI=F,USDINR=X'
          fields = 'regularMarketPrice,regularMarketChange,regularMarketChangePercent,shortName'

          if crumb:
              url = (
                  'https://query2.finance.yahoo.com/v8/finance/quote'
                  f'?symbols={urllib.parse.quote(symbols)}'
                  f'&fields={urllib.parse.quote(fields)}'
                  f'&crumb={urllib.parse.quote(crumb)}'
              )
              headers = {'User-Agent': UA, 'Cookie': cookie, 'Accept': 'application/json'}
          else:
              # Fallback: try without crumb
              url = (
                  'https://query1.finance.yahoo.com/v7/finance/quote'
                  f'?symbols={urllib.parse.quote(symbols)}'
                  f'&fields={urllib.parse.quote(fields)}'
              )
              headers = {
                  'User-Agent': UA,
                  'Accept': 'application/json',
                  'Origin': 'https://finance.yahoo.com',
                  'Referer': 'https://finance.yahoo.com/',
              }

          print(f'Fetching: {url[:80]}...')
          req3 = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req3, timeout=15) as resp:
                  body = resp.read().decode('utf-8')
          except Exception as e:
              print(f'Quote fetch failed: {e}', file=sys.stderr)
              sys.exit(1)

          # Step 4: Validate and inject timestamp
          try:
              data = json.loads(body)
          except json.JSONDecodeError as e:
              print(f'JSON parse error: {e}', file=sys.stderr)
              print(f'Response body: {body[:500]}', file=sys.stderr)
              sys.exit(1)

          quotes = data.get('quoteResponse', {}).get('result', [])
          if not quotes:
              print(f'No quotes in response: {body[:500]}', file=sys.stderr)
              sys.exit(1)

          data['fetchedAt'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          with open('data/rates.json', 'w') as f:
              json.dump(data, f)

          print(f'OK: {len(quotes)} quotes — {[q.get("symbol") for q in quotes]}')
          EOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "rates: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
